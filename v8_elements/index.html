<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Elements - HTML</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>I am a para</p>
    <!-- p is a block element taking all width avaialable-->
    <a href="https://google.com">Google</a>
    <!-- a is an inline element taking only width necessary -->
    <div>
        I am a block element : div
    </div>
    <span>I am a span and i'm inline</span>
    <a href="">Yes, he is inline</a>
    <!-- you can convert an inline element to block and vice versa -->

</body>

</html>
